name: sync-cos
# 把对外版（public 分支）同步到腾讯云香港 COS（CDN 回源用）。
# 触发：publish-public 跑完后自动同步 / 手动运行。MD5 相同的文件会跳过，所以无变化时几乎不耗时间。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置 4 个 secrets：
#   COS_SECRET_ID、COS_SECRET_KEY（子账号密钥，只给这个存储桶的写权限）、COS_BUCKET（形如 invest-board-1250000000）、COS_REGION（ap-hongkong）
on:
  workflow_run:
    workflows: [publish-public]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sync-cos
  cancel-in-progress: true
jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install coscmd
      - name: 同步到 COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          test -n "$COS_SECRET_ID" -a -n "$COS_SECRET_KEY" -a -n "$COS_BUCKET" || { echo "缺少 COS_* secrets"; exit 1; }
          test -f index.html || { echo "public 分支里没有 index.html，停止"; exit 1; }
          rm -rf .git
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "${COS_REGION:-ap-hongkong}"
          # 第三方库带版本号、内容不变：先单独上传并设一年缓存（主同步时 MD5 相同会跳过，缓存头保持不变）
          if [ -d vendor ]; then coscmd upload -r -s -H '{"Cache-Control":"max-age=31536000"}' vendor /vendor/; fi
          coscmd upload -r -s --delete -f --ignore ".nojekyll" \
            -H '{"Cache-Control":"max-age=300"}' . /
          echo "同步完成"
