<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>持仓数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --navy:#1f3050; --accent:#2a6fdb; --up:#d43f3a; --down:#3a9d3a; --flat:#999;
    --text:#1a1a18; --sec:#63625d; --muted:#9c9a93; --bg:#f5f4f1; --card:#fff;
    --border:#eae7df; --border2:#d6d3ca;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px}
  header{background:var(--card);color:var(--text);padding:16px 20px 12px}
  header h1{margin:0;font-size:18px;font-weight:700}
  header .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .ind-bar{display:flex;gap:6px;background:var(--card);padding:0 16px;overflow-x:auto;
    border-bottom:1px solid var(--border)}
  .ind-btn{border:none;background:none;color:var(--sec);padding:10px 14px;font-size:16px;
    cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
  .ind-btn.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
  .wrap{max-width:920px;margin:0 auto;padding:16px 16px 48px}
  .sub-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
  .sub-btn{border:1px solid var(--border2);background:var(--card);color:var(--sec);
    padding:7px 20px;font-size:14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
  .sub-btn.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .pane{background:transparent;padding:0}
  .grp-title{font-size:12px;color:var(--muted);font-weight:600;margin:20px 2px 10px;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:360px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card .top{display:flex;justify-content:space-between;align-items:center}
  .card .nm{font-size:13px;color:var(--sec)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .card .val{font-size:28px;font-weight:700;margin-top:8px;letter-spacing:-.5px;line-height:1.1}
  .card .u{font-size:12px;color:var(--muted);font-weight:400}
  .card .chg{font-size:13px;margin-top:5px;font-weight:600}
  .card .yoy{font-size:12px;color:var(--sec);margin-top:3px}
  .card .meta-line{font-size:12px;color:var(--muted);margin-top:5px}
  .ranges{display:flex;gap:6px;margin:4px 0 14px}
  .rg{border:1px solid var(--border);background:var(--card);color:var(--muted);
    padding:4px 14px;font-size:12px;border-radius:999px;cursor:pointer}
  .rg.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chart{width:100%;height:340px}
  .tbl-wrap{overflow-x:auto;margin-top:14px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:4px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:360px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
  tbody tr:last-child td{border-bottom:none}
  thead th{background:var(--card);color:var(--sec);font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .empty{color:var(--muted);padding:36px;text-align:center}
  /* ERP 模块 */
  .erp-timebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 6px}
  .erp-rg{border:1px solid var(--border2);background:var(--card);color:var(--sec);
    padding:6px 16px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
  .erp-rg.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .erp-custom{display:flex;align-items:center;gap:4px;border:1px solid var(--border2);
    border-radius:10px;padding:5px 12px;font-size:13px;color:var(--sec)}
  .erp-custom input{border:none;font-size:13px;color:var(--text);font-family:inherit;background:transparent;width:120px}
  .erp-chart-title{font-size:14px;color:var(--text);font-weight:600;margin:20px 2px 4px}
  .erp-chart-sub{font-size:12px;color:var(--muted);margin:0 2px 6px}
  .erp-chart{width:100%;height:300px}
  @media(max-width:600px){.erp-chart{height:250px}.erp-custom input{width:96px}}
  @media (max-width:600px){
    .wrap{padding:14px 12px 40px}.chart{height:280px}
    .card{padding:14px 15px;border-radius:14px}.card .val{font-size:24px}
  }
  .agri-acc{grid-column:1/-1;background:var(--card);border:1px solid var(--navy);border-radius:16px;padding:10px 14px;margin-top:-4px}
  .agri-sub{font-size:12.5px;color:var(--sec);margin:4px 2px 6px}
</style>
</head>
<body>
<header>
  <h1>持仓数据看板</h1>
  <div class="sub" id="subhead">加载中…</div>
</header>
<div class="ind-bar" id="indBar"></div>
<div class="wrap">
  <div class="sub-bar" id="subBar"></div>
  <div class="pane" id="pane"></div>
</div>

<script>
// ====== 数据加载：内嵌优先，否则 fetch。上线版 EMBEDDED 置空则全部走 fetch ======
const EMBEDDED = {};
async function loadJSON(path){
  if(path in EMBEDDED) return JSON.parse(JSON.stringify(EMBEDDED[path]));
  const r = await fetch(path);
  if(!r.ok) throw new Error(path+" 加载失败 "+r.status);
  return r.json();
}
const _cache = {};
async function loadCached(url){
  if(url in _cache) return _cache[url];
  const v = await loadJSON(url); _cache[url] = v; return v;
}

// ================== 电解铝（大宗商品）部分 —— 保持原逻辑 ==================
const CAT_NAME = {price:"价格", cost:"成本", inventory:"库存"};
const CAT_ORDER = ["price","cost","inventory"];
const RANGES = [["1m","近1月",30],["6m","近6月",180],["1y","近1年",365],["all","全部",null]];
const SERIES_COLORS = ["#2a6fdb","#1d9e75","#ba7517","#8a5cd1","#d4537e"];

let MODULES = [];
let curTop = null;                 // 当前一级：模块id 或 "erp"
let curMod = null, curSub = null, curRange = "1m";
let chart = null;

function chgClass(v){ return v>0?"up":(v<0?"down":"flat"); }
function chgText(v,dp){ if(v==null) return "—"; const s=v>0?"▲ +":(v<0?"▼ ":"— "); return s+(v===0?"0":v.toFixed(dp)); }
function dotColor(m){
  if(m.last_ingest && m.last_ingest.status==="failed") return "var(--up)";
  if(!m.latest) return "var(--muted)";
  return "var(--down)";
}

async function boot(){
  try{
    const md = await loadJSON("api/modules.json");
    MODULES = md.modules || [];
    document.getElementById("subhead").textContent =
      "数据源 Mysteel 等 · 最近生成 " + (md.generated_at||"").slice(0,16).replace("T"," ");
  }catch(e){ MODULES = []; document.getElementById("subhead").textContent = "持仓与估值数据"; }
  renderIndBar();
  selectErp();   // 默认打开股权溢价指数（放首位）
}

function renderIndBar(){
  const bar = document.getElementById("indBar");
  bar.innerHTML = "";
  const e=document.createElement("button");   // 股权溢价指数放首位
  e.className="ind-btn"+(curTop==="erp"?" on":"");
  e.textContent="指数估值"; e.onclick=()=>selectErp();
  bar.appendChild(e);
  MODULES.forEach(m=>{                          // 大宗模块（电解铝）其次
    const b=document.createElement("button");
    b.className="ind-btn"+(curTop===m.id?" on":"");
    b.textContent=m.name; b.onclick=()=>selectModule(m.id);
    bar.appendChild(b);
  });
  const mt=document.createElement("button");    // 金属模块
  mt.className="ind-btn"+(curTop==="metals"?" on":"");
  mt.textContent="金属"; mt.onclick=()=>selectMetals();
  bar.appendChild(mt);
  const ag=document.createElement("button");    // 农产品模块
  ag.className="ind-btn"+(curTop==="agri"?" on":"");
  ag.textContent="农产品"; ag.onclick=()=>selectAgri();
  bar.appendChild(ag);
}

async function selectModule(id){
  curTop=id; curMod=id; chart=null; erpCharts=[];
  renderIndBar();
  const mod = MODULES.find(m=>m.id===id);
  const cats = CAT_ORDER.filter(c=> mod.metrics.some(x=>x.category===c));
  const subs = ["overview"].concat(cats);
  curSub = subs[0];
  renderSubBar(subs);
  renderPane();
}

function renderSubBar(subs){
  const bar=document.getElementById("subBar");
  bar.innerHTML="";
  subs.forEach(s=>{
    const b=document.createElement("button");
    b.className="sub-btn"+(s===curSub?" on":"");
    b.textContent = s==="overview" ? "概览" : (CAT_NAME[s]||s);
    b.onclick=()=>{ curSub=s; renderSubBar(subs); renderPane(); };
    bar.appendChild(b);
  });
}

async function renderPane(){
  const pane=document.getElementById("pane");
  chart=null;
  if(curSub==="overview"){ await renderOverview(pane); }
  else { await renderCategory(pane, curSub); }
}

async function renderOverview(pane){
  const ov = await loadJSON("api/overview/"+curMod+".json");
  const byCat={};
  ov.metrics.forEach(m=>{ if(m.hide_overview) return; (byCat[m.category]=byCat[m.category]||[]).push(m); });
  let html="";
  CAT_ORDER.filter(c=>byCat[c]).forEach(c=>{
    html += '<div class="grp-title">'+(CAT_NAME[c]||c)+'</div><div class="grid">';
    byCat[c].forEach(m=>{
      const L=m.latest; const dp = m.unit==="万吨"?1:0;
      html += '<div class="card"><div class="top"><span class="nm">'+m.name+
        '</span><span class="dot" style="background:'+dotColor(m)+'"></span></div>';
      if(L){
        html += '<div><span class="val">'+L.value.toLocaleString()+'</span> <span class="u">'+m.unit+'</span></div>';
        const chgVal = (L.mom!=null ? L.mom : (L.src_change!=null ? L.src_change : null));
        if(L.region){
          html += '<div class="meta-line">'+L.region+' · <span class="'+chgClass(chgVal)+'">'+chgText(chgVal,dp)+'</span></div>';
        } else { html += '<div class="chg '+chgClass(chgVal)+'">'+chgText(chgVal,dp)+'</div>'; }
        if(L.yoy!=null) html+='<div class="yoy">同比 '+chgText(L.yoy,dp)+'</div>';
      } else { html+='<div class="val" style="color:var(--muted)">暂无</div>'; }
      html += '</div>';
    });
    html+='</div>';
  });
  pane.innerHTML = html || '<div class="empty">暂无数据</div>';
}

async function renderCategory(pane, cat){
  const mod = MODULES.find(m=>m.id===curMod);
  const metrics = mod.metrics.filter(x=>x.category===cat);
  let html='<div class="ranges">';
  RANGES.forEach(([k,label])=> html+='<span class="rg'+(k===curRange?" on":"")+'" data-r="'+k+'">'+label+'</span>');
  html+='</div><div class="chart" id="chart"></div><div class="tbl-wrap" id="tbl"></div>';
  pane.innerHTML=html;
  pane.querySelectorAll(".rg").forEach(el=> el.onclick=()=>{ curRange=el.dataset.r; renderCategory(pane,cat); });

  const useFull = (curRange !== "1m");
  const seriesData = {};
  for(const m of metrics){
    const url = "api/series/"+m.id+(useFull?".full":"")+".json";
    const s = await loadCached(url); seriesData[m.id] = (s && s.points) || [];
  }
  const cutoff = rangeCutoff(curRange);
  const dp = metrics[0] && metrics[0].unit==="万吨"?1:0;
  const dateSet=new Set();
  metrics.forEach(m=> seriesData[m.id].forEach(p=>{ if(!cutoff||p.date>=cutoff) dateSet.add(p.date); }));
  const dates=[...dateSet].sort();
  const chartMetrics = metrics.filter(m=> !m.hide_chart);
  drawChart(chartMetrics, seriesData, dates, dp);
  drawTable(metrics, seriesData, dates, dp);
}

function rangeCutoff(k){
  const days={"1m":30,"6m":180,"1y":365,"all":null}[k];
  if(!days) return null;
  const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10);
}

function drawChart(metrics, seriesData, dates, dp){
  const el=document.getElementById("chart"); chart=echarts.init(el);
  const series=metrics.map((m,i)=>{
    const map={}; seriesData[m.id].forEach(p=>map[p.date]=p.value);
    return {name:m.name, type:"line", smooth:false, showSymbol:true, symbolSize:4,
      lineStyle:{width:2}, itemStyle:{color:SERIES_COLORS[i%SERIES_COLORS.length]},
      data:dates.map(d=> d in map?map[d]:null), connectNulls:true};
  });
  chart.setOption({
    grid:{left:8,right:12,top:36,bottom:24,containLabel:true},
    legend:{top:0, data:metrics.map(m=>m.name), icon:"roundRect", itemWidth:14, itemHeight:3},
    tooltip:{trigger:"axis", valueFormatter:v=> v==null?"—":v.toFixed(dp)},
    xAxis:{type:"category", data:dates, boundaryGap:false,
      axisLabel:{color:"#888", formatter:v=>v.slice(5)}, axisLine:{lineStyle:{color:"#ddd"}}},
    yAxis:{type:"value", scale:true, splitLine:{lineStyle:{color:"#eee"}}, axisLabel:{color:"#888"}},
    series: series,
  });
}

function drawTable(metrics, seriesData, dates, dp){
  const maps={}; metrics.forEach(m=>{ maps[m.id]={}; seriesData[m.id].forEach(p=>maps[m.id][p.date]=p); });
  let h='<table><thead><tr><th>日期</th>';
  metrics.forEach(m=> h+='<th>'+m.name+'</th>'); h+='</tr></thead><tbody>';
  [...dates].reverse().forEach(d=>{
    h+='<tr><td>'+d+'</td>';
    metrics.forEach(m=>{
      const p=maps[m.id][d];
      if(!p){ h+='<td>—</td>'; return; }
      const c=p.change;
      const chg = c==null?"":' <span class="'+chgClass(c)+'">('+(c>0?"+":"")+(c===0?"0":c.toFixed(dp))+')</span>';
      h+='<td>'+p.value.toLocaleString()+chg+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  document.getElementById("tbl").innerHTML=h;
}

// ================== 指数估值模块（PE/PB/PS 分位；沪深300 保留 ERP）==================
let curErpIdx = "csi300";
let valIndexes = [];
let valMetric = "pe", valYear = 5;
let erpCharts = [];

function selectErp(){                 // 一级 tab「指数估值」处理器（沿用函数名）
  curTop="erp"; chart=null; erpCharts=[];
  renderIndBar();
  (async()=>{
    if(!valIndexes.length){
      try{ const ix=await loadJSON("valuation_api/indexes.json"); valIndexes=ix.indexes||[]; }
      catch(e){ valIndexes=[{id:"csi300",name:"沪深300",years:[5,10]}]; }
    }
    if(!valIndexes.some(x=>x.id===curErpIdx)) curErpIdx=(valIndexes[0]||{}).id||"csi300";
    const yy=(valIndexes.find(x=>x.id===curErpIdx)||{}).years||[5];
    if(!yy.includes(valYear)) valYear=yy[0];
    renderValSubBar(); renderValPane();
  })();
}

function renderValSubBar(){
  const bar=document.getElementById("subBar"); bar.innerHTML="";
  valIndexes.forEach(ix=>{
    const b=document.createElement("button");
    b.className="sub-btn"+(ix.id===curErpIdx?" on":"");
    b.textContent=ix.name;
    b.onclick=()=>{ curErpIdx=ix.id; valMetric="pe";
      const yy=ix.years||[5]; valYear=yy.includes(valYear)?valYear:yy[0];
      renderValSubBar(); renderValPane(); };
    bar.appendChild(b);
  });
}

function valIdxMeta(){ return valIndexes.find(x=>x.id===curErpIdx)||{name:"",years:[5]}; }
function valPosClass(pos){ return pos==null?"flat":(pos<0.3?"down":(pos>0.7?"up":"flat")); }
function valCard(lab, L, M, pos){
  const posTxt = pos==null? "—" : (Math.round(pos*100)+"%");
  return '<div class="card"><div class="nm">'+lab+'</div>'+
    '<div><span class="val">'+(L&&L.value!=null?L.value.toFixed(2):"—")+'</span></div>'+
    '<div class="meta-line">中位数 '+(M&&M.value!=null?M.value.toFixed(2):"—")+'</div>'+
    '<div class="chg '+valPosClass(pos)+'">近'+valYear+'年百分位 '+posTxt+'</div></div>';
}

async function renderValPane(){
  const pane=document.getElementById("pane");
  const idx=curErpIdx, meta=valIdxMeta(), nm=meta.name, years=meta.years||[5];
  const [ov, perc] = await Promise.all([
    loadCached("valuation_api/"+idx+"/overview.json"),
    loadCached("valuation_api/"+idx+"/percentiles.json"),
  ]);
  let html='<div class="grp-title">'+nm+' 估值</div><div class="grid">';
  [["pe","PE-TTM","pe_median"],["pb","PB","pb_median"],["ps","PS-TTM","ps_median"]].forEach(([m,lab,med])=>{
    const q=(perc.metrics[m]||{})[valYear+"y"];
    html+=valCard(lab, ov.latest[m], ov.latest[med], q?q.cur_pos:null);
  });
  html+='</div>';
  html+='<div class="ranges" id="valMetricBar">';
  [["pe","PE"],["pb","PB"],["ps","PS"]].forEach(([m,l])=> html+='<span class="rg'+(m===valMetric?" on":"")+'" data-m="'+m+'">'+l+'</span>');
  html+='</div>';
  if(years.length>1){
    html+='<div class="ranges" id="valYearBar">';
    years.forEach(y=> html+='<span class="rg'+(y===valYear?" on":"")+'" data-y="'+y+'">近'+y+'年</span>');
    html+='</div>';
  }
  html+='<div class="erp-chart-sub" id="valsub"></div><div class="erp-chart" id="valchart"></div>';
  if(idx==="csi300"){
    html+='<div class="erp-chart-title" style="margin-top:22px">沪深300 股权溢价指数（股债性价比）</div>';
    html+='<div class="erp-chart-sub">点位（左轴）+ 股权溢价指数%（右轴）</div><div class="erp-chart" id="erpc1"></div>';
    html+='<div class="erp-chart-sub" id="erpsub2"></div><div class="erp-chart" id="erpc2"></div>';
  }
  pane.innerHTML=html;
  document.querySelectorAll("#valMetricBar .rg").forEach(el=>el.onclick=()=>{ valMetric=el.dataset.m; renderValPane(); });
  const yb=document.getElementById("valYearBar");
  if(yb) yb.querySelectorAll(".rg").forEach(el=>el.onclick=()=>{ valYear=+el.dataset.y; renderValPane(); });

  erpCharts.forEach(c=>{ try{ c&&c.dispose&&c.dispose(); }catch(e){} }); erpCharts=[];
  const s=await loadCached("valuation_api/"+idx+"/series/"+valMetric+".full.json");
  const label={pe:"PE-TTM",pb:"PB",ps:"PS-TTM"}[valMetric];
  const q=(perc.metrics[valMetric]||{})[valYear+"y"];
  drawErpQuant("valchart","valsub",label,"#1d9e75",s.points.map(p=>p.date),s.points,q,2,"","近"+valYear+"年");
  if(idx==="csi300") await drawCsi300Erp();
}

async function drawCsi300Erp(){
  let close, erp, perc;
  try{
    [close, erp, perc] = await Promise.all([
      loadCached("erp_api/csi300/series/close.full.json"),
      loadCached("erp_api/csi300/series/erp.full.json"),
      loadCached("erp_api/csi300/percentiles.json"),
    ]);
  }catch(e){ return; }
  const dates=close.points.map(p=>p.date);
  const emap={}; erp.points.forEach(p=>emap[p.date]=p.value);
  const c1=echarts.init(document.getElementById("erpc1"));
  c1.setOption({
    grid:{left:8,right:10,top:30,bottom:24,containLabel:true},
    legend:{top:0,data:["沪深300","股权溢价指数"],icon:"roundRect",itemWidth:14,itemHeight:3},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:dates,boundaryGap:false,axisLabel:{color:"#888",formatter:v=>v.slice(2,7)},axisLine:{lineStyle:{color:"#ddd"}}},
    yAxis:[{type:"value",scale:true,name:"点位",splitLine:{lineStyle:{color:"#eee"}},axisLabel:{color:"#888"}},
           {type:"value",scale:true,name:"溢价%",splitLine:{show:false},axisLabel:{color:"#888"}}],
    series:[
      {name:"沪深300",type:"line",yAxisIndex:0,showSymbol:false,lineStyle:{width:2},itemStyle:{color:"#2a6fdb"},data:close.points.map(p=>p.value)},
      {name:"股权溢价指数",type:"line",yAxisIndex:1,showSymbol:false,lineStyle:{width:2},itemStyle:{color:"#d4537e"},data:dates.map(d=>emap[d]==null?null:emap[d]),connectNulls:true},
    ],
  });
  erpCharts.push(c1);
  drawErpQuant("erpc2","erpsub2","股权溢价指数","#d4537e",erp.points.map(p=>p.date),erp.points,(perc.erp||{})["5y"],2,"%","近5年");
}

function drawErpQuant(elId, subId, name, color, dates, ptsF, q, dp, unit, yrLabel){
  yrLabel = yrLabel || "近5年";
  const sub=document.getElementById(subId); const ml=[];
  if(q){
    sub.textContent="分位线："+yrLabel+"　20% "+q.p20.toFixed(dp)+unit+"　50% "+q.p50.toFixed(dp)+unit+"　80% "+q.p80.toFixed(dp)+unit;
    [["20%",q.p20,"#8fbf8f"],["50%",q.p50,"#e0a53b"],["80%",q.p80,"#d47a7a"]].forEach(([lab,val,col])=>{
      ml.push({yAxis:val, lineStyle:{type:"dashed",color:col,width:1},
        label:{formatter:lab+"分位 "+val.toFixed(dp)+unit, color:col, position:"end", distance:4, fontSize:11}});
    });
  } else { sub.textContent=""; }
  const el=echarts.init(document.getElementById(elId));
  el.setOption({
    grid:{left:8,right:96,top:16,bottom:24,containLabel:true},
    tooltip:{trigger:"axis", valueFormatter:v=> v==null?"—":Number(v).toFixed(dp)+unit},
    xAxis:{type:"category",data:dates,boundaryGap:false,axisLabel:{color:"#888",formatter:v=>v.slice(2,7)},axisLine:{lineStyle:{color:"#ddd"}}},
    yAxis:{type:"value",scale:true,splitLine:{lineStyle:{color:"#eee"}},axisLabel:{color:"#888"}},
    series:[{name:name,type:"line",showSymbol:false,lineStyle:{width:2},itemStyle:{color:color},
      data:ptsF.map(p=>p.value), markLine:{silent:true,symbol:"none",data:ml}}],
  });
  erpCharts.push(el);
}


// ================== 金属模块（新增：概览分块 + 金/铜/锂走势） ==================
const METAL_ORDER = ["gold","copper","lithium"];
const METALS_RANGES = [["1m","近1月"],["6m","近6月"],["1y","近1年"],["all","全部"]];
let metalsOv = null, metalsSub = "overview", metalsRange = "1y", metalsChart = null;

function metalDp(unit){
  if(unit==="元/克") return 2;
  if(unit==="美元/盎司"||unit==="万吨") return 1;
  return 0;   // 元/吨、美元/吨
}

async function selectMetals(){
  curTop="metals"; chart=null; erpCharts=[]; metalsChart=null;
  renderIndBar();
  metalsOv = await loadJSON("metals_api/overview.json");
  metalsSub = "overview";
  renderMetalsSubBar();
  renderMetalsPane();
}

function renderMetalsSubBar(){
  const bar=document.getElementById("subBar"); bar.innerHTML="";
  const subs=["overview"].concat(METAL_ORDER.filter(k=> (metalsOv.metals||[]).some(g=>g.id===k)));
  subs.forEach(k=>{
    const b=document.createElement("button");
    const label = k==="overview" ? "概览" : (metalsOv.metals.find(g=>g.id===k)||{}).name;
    b.className="sub-btn"+(k===metalsSub?" on":"");
    b.textContent=label; b.onclick=()=>{ metalsSub=k; renderMetalsSubBar(); renderMetalsPane(); };
    bar.appendChild(b);
  });
}

async function renderMetalsPane(){
  metalsChart=null;
  const pane=document.getElementById("pane");
  if(metalsSub==="overview"){ renderMetalsOverview(pane); }
  else { await renderMetalsChart(pane, metalsSub); }
}

// —— 概览：按金属分块（分组标题 + 卡片网格）——
function renderMetalsOverview(pane){
  let html="";
  metalsOv.metals.forEach(g=>{
    html += '<div class="grp-title">'+g.name+'</div><div class="grid">';
    g.metrics.forEach(m=>{
      if(m.hide_overview) return;   // 概览卡跳过隐藏项（如优质/工业级中间价、现货最低最高涨跌）
      const L=m.latest, dp=metalDp(m.unit);
      html += '<div class="card"><div class="top"><span class="nm">'+m.name+
        '</span><span class="dot" style="background:'+(L?"var(--down)":"var(--muted)")+'"></span></div>';
      if(L){
        html += '<div><span class="val">'+L.value.toLocaleString()+'</span> <span class="u">'+m.unit+'</span></div>';
        html += '<div class="chg '+chgClass(L.change)+'">'+chgText(L.change,dp)+'</div>';
      } else { html += '<div class="val" style="color:var(--muted)">暂无</div>'; }
      html += '</div>';
    });
    html += '</div>';
  });
  pane.innerHTML = html || '<div class="empty">暂无数据</div>';
}

// —— 单金属页：走势图（同量纲同轴，不同量纲用左右双轴）——
async function renderMetalsChart(pane, metalId){
  const g = metalsOv.metals.find(x=>x.id===metalId);
  const metrics = g.metrics.filter(m=> !m.hide_chart);   // 库存类不上价格图
  let html='<div class="ranges">';
  METALS_RANGES.forEach(([k,label])=> html+='<span class="rg'+(k===metalsRange?" on":"")+'" data-r="'+k+'">'+label+'</span>');
  html+='</div><div class="chart" id="metalsChart"></div><div class="tbl-wrap" id="metalsTbl"></div>';
  pane.innerHTML=html;
  pane.querySelectorAll(".rg").forEach(el=> el.onclick=()=>{ metalsRange=el.dataset.r; renderMetalsChart(pane,metalId); });

  const useFull = (metalsRange==="1y"||metalsRange==="all");
  const seriesData={};
  for(const m of metrics){
    const s = await loadCached("metals_api/series/"+m.id+(useFull?".full":"")+".json");
    seriesData[m.id] = (s&&s.points)||[];
  }
  const cutoff = rangeCutoff(metalsRange);
  const dateSet=new Set();
  metrics.forEach(m=> seriesData[m.id].forEach(p=>{ if(!cutoff||p.date>=cutoff) dateSet.add(p.date); }));
  const dates=[...dateSet].sort();

  // 按单位分配 y 轴（最多两个）
  const units=[]; metrics.forEach(m=>{ if(!units.includes(m.unit)) units.push(m.unit); });
  const yAxis = units.slice(0,2).map((u,i)=>({type:"value",scale:true,name:u,position:i===0?"left":"right",
    splitLine:{show:i===0,lineStyle:{color:"#eee"}},axisLabel:{color:"#888"}}));
  const series = metrics.map((m,i)=>{
    const map={}; seriesData[m.id].forEach(p=>map[p.date]=p.value);
    const axi = units.indexOf(m.unit); 
    return {name:m.name,type:"line",yAxisIndex:(axi>1?1:axi),showSymbol:false,lineStyle:{width:2},
      itemStyle:{color:SERIES_COLORS[i%SERIES_COLORS.length]},
      data:dates.map(d=> d in map?map[d]:null),connectNulls:true};
  });
  metalsChart=echarts.init(document.getElementById("metalsChart"));
  metalsChart.setOption({
    grid:{left:8,right:units.length>1?12:12,top:36,bottom:24,containLabel:true},
    legend:{top:0,data:metrics.map(m=>m.name),icon:"roundRect",itemWidth:14,itemHeight:3},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:dates,boundaryGap:false,axisLabel:{color:"#888",formatter:v=>v.slice(2,7)},axisLine:{lineStyle:{color:"#ddd"}}},
    yAxis: yAxis.length?yAxis:[{type:"value",scale:true}],
    series: series,
  });
  drawMetalsTable(metrics, seriesData, dates);
}

// 走势页表格：日期 + 各指标当日值（金/铜=收盘价，锂=各价中间价），跟随时间范围
function drawMetalsTable(metrics, seriesData, dates){
  const maps={}; metrics.forEach(m=>{ maps[m.id]={}; (seriesData[m.id]||[]).forEach(p=>maps[m.id][p.date]=p.value); });
  let h='<table><thead><tr><th>日期</th>';
  metrics.forEach(m=> h+='<th>'+m.name+'</th>');
  h+='</tr></thead><tbody>';
  [...dates].reverse().forEach(d=>{
    h+='<tr><td>'+d+'</td>';
    metrics.forEach(m=>{
      const v=maps[m.id][d];
      h+='<td>'+(v==null?'—':v.toLocaleString(undefined,{minimumFractionDigits:metalDp(m.unit),maximumFractionDigits:metalDp(m.unit)}))+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  document.getElementById("metalsTbl").innerHTML=h;
}

// ================== 农产品模块（概览网格 + 手风琴展开历史图+分位） ==================
let agriOv = null, agriOpen = null, agriChart = null, agriRange = "1y";
const AGRI_RANGES = [["6m","近6月"],["1y","近1年"],["3y","近3年"],["all","全部"]];

async function selectAgri(){
  curTop="agri"; chart=null; erpCharts=[]; metalsChart=null; agriChart=null; agriOpen=null;
  renderIndBar();
  document.getElementById("subBar").innerHTML="";   // 农产品只有一页，不需要子tab
  agriOv = await loadJSON("agri_api/overview.json");
  renderAgri();
}

function agriChgCls(v){ return v>0?"up":(v<0?"down":"flat"); }
function agriChgTxt(v){ if(v==null) return "—"; return (v>0?"▲ +":(v<0?"▼ ":"— "))+Math.abs(v).toLocaleString(); }

function renderAgri(){
  const pane=document.getElementById("pane");
  const ps=(agriOv.products||[]);
  let html='<div class="grid">';
  ps.forEach(p=>{
    const L=p.latest;
    html+='<div class="card agri-card'+(p.id===agriOpen?' on':'')+'" data-pid="'+p.id+'" style="cursor:pointer">'+
      '<div class="nm">'+p.name+'</div>'+
      (L? '<div><span class="val">'+L.value.toLocaleString()+'</span> <span class="u">'+p.unit+'</span></div>'+
          '<div class="chg '+agriChgCls(p.change)+'">'+agriChgTxt(p.change)+'</div>'
        : '<div class="val" style="color:var(--muted)">暂无</div>')+
      '</div>';
    if(p.id===agriOpen){
      html+='<div class="agri-acc"><div class="ranges" id="agriRanges">';
      AGRI_RANGES.forEach(([k,lb])=> html+='<span class="rg'+(k===agriRange?" on":"")+'" data-r="'+k+'">'+lb+'</span>');
      html+='</div><div class="agri-sub">'+p.name+' · 历史价格 + 20/50/80 分位线</div>'+
            '<div class="chart" id="agriChart"></div></div>';
    }
  });
  html+='</div>';
  pane.innerHTML=html;

  pane.querySelectorAll(".agri-card").forEach(c=> c.onclick=(e)=>{
    if(e.target.closest(".agri-acc")) return;         // 点展开区内部不收起
    agriOpen = (agriOpen===c.dataset.pid)? null : c.dataset.pid;
    if(agriChart){ agriChart.dispose(); agriChart=null; }
    renderAgri();
  });
  if(agriOpen){
    const rr=document.getElementById("agriRanges");
    if(rr) rr.querySelectorAll(".rg").forEach(el=> el.onclick=()=>{ agriRange=el.dataset.r; drawAgriChart(agriOpen); });
    drawAgriChart(agriOpen);
  }
}

async function drawAgriChart(pid){
  const p=(agriOv.products||[]).find(x=>x.id===pid); if(!p) return;
  const useFull=(agriRange==="3y"||agriRange==="all");
  const s=await loadCached("agri_api/series/"+pid+(useFull?".full":"")+".json");
  let pts=(s&&s.points)||[];
  const cutoff=agriRangeCutoff(agriRange);
  if(cutoff) pts=pts.filter(x=>x.date>=cutoff);
  const ml=[["20%",p.p20,"#8fbf8f"],["50%",p.p50,"#e0a53b"],["80%",p.p80,"#d47a7a"]]
    .filter(x=>x[1]!=null).map(([lab,val,col])=>(
      {yAxis:val,lineStyle:{type:"dashed",color:col,width:1},
       label:{formatter:lab+"分位 "+val.toLocaleString(),color:col,position:"end",distance:4,fontSize:11}}));
  const el=document.getElementById("agriChart"); if(!el) return;
  agriChart=echarts.init(el);
  agriChart.setOption({
    grid:{left:8,right:92,top:16,bottom:24,containLabel:true},
    tooltip:{trigger:"axis", valueFormatter:v=> v==null?"—":Number(v).toLocaleString()},
    xAxis:{type:"category",data:pts.map(x=>x.date),boundaryGap:false,
      axisLabel:{color:"#888",formatter:v=>v.slice(2,7)},axisLine:{lineStyle:{color:"#ddd"}}},
    yAxis:{type:"value",scale:true,splitLine:{lineStyle:{color:"#eee"}},axisLabel:{color:"#888"}},
    series:[{name:p.name,type:"line",showSymbol:false,lineStyle:{width:2},itemStyle:{color:"#2a6fdb"},
      data:pts.map(x=>x.value),markLine:{silent:true,symbol:"none",data:ml}}],
  });
}

function agriRangeCutoff(k){
  const days={"6m":183,"1y":366,"3y":1096,"all":null}[k];
  if(!days) return null;
  const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10);
}

window.addEventListener("resize", ()=>{
  if(chart) chart.resize();
  erpCharts.forEach(c=> c && c.resize && c.resize());
  if(metalsChart) metalsChart.resize();
  if(agriChart) agriChart.resize();
});
boot();
</script>
