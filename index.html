<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投资数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --navy:#1f3050; --accent:#2a6fdb; --up:#d43f3a; --down:#3a9d3a; --flat:#999;
    --text:#1a1a18; --sec:#63625d; --muted:#9c9a93; --bg:#f5f4f1; --card:#fff;
    --border:#eae7df; --border2:#d6d3ca;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px}
  header{background:var(--card);color:var(--text);padding:16px 20px 12px}
  header h1{margin:0;font-size:18px;font-weight:700}
  header .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .ind-bar{display:flex;gap:6px;background:var(--card);padding:0 16px;overflow-x:auto;
    border-bottom:1px solid var(--border)}
  .ind-btn{border:none;background:none;color:var(--sec);padding:10px 14px;font-size:16px;
    cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
  .ind-btn.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
  .wrap{max-width:920px;margin:0 auto;padding:16px 16px 48px}
  .sub-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
  .sub-btn{border:1px solid var(--border2);background:var(--card);color:var(--sec);
    padding:7px 20px;font-size:14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
  .sub-btn.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .pane{background:transparent;padding:0}
  .grp-title{font-size:12px;color:var(--muted);font-weight:600;margin:20px 2px 10px;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:360px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card .top{display:flex;justify-content:space-between;align-items:center}
  .card .nm{font-size:13px;color:var(--sec)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .card .val{font-size:28px;font-weight:700;margin-top:8px;letter-spacing:-.5px;line-height:1.1}
  .card .u{font-size:12px;color:var(--muted);font-weight:400}
  .card .chg{font-size:13px;margin-top:5px;font-weight:600}
  .card .yoy{font-size:12px;color:var(--sec);margin-top:3px}
  .card .meta-line{font-size:12px;color:var(--muted);margin-top:5px}
  .ranges{display:flex;gap:6px;margin:4px 0 14px}
  .rg{border:1px solid var(--border);background:var(--card);color:var(--muted);
    padding:4px 14px;font-size:12px;border-radius:999px;cursor:pointer}
  .rg.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chart{width:100%;height:340px}
  .tbl-wrap{overflow-x:auto;margin-top:14px;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:4px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:360px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
  tbody tr:last-child td{border-bottom:none}
  thead th{background:var(--card);color:var(--sec);font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .empty{color:var(--muted);padding:36px;text-align:center}
  /* ERP 模块 */
  .erp-timebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 6px}
  .erp-rg{border:1px solid var(--border2);background:var(--card);color:var(--sec);
    padding:6px 16px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
  .erp-rg.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  .erp-custom{display:flex;align-items:center;gap:4px;border:1px solid var(--border2);
    border-radius:10px;padding:5px 12px;font-size:13px;color:var(--sec)}
  .erp-custom input{border:none;font-size:13px;color:var(--text);font-family:inherit;background:transparent;width:120px}
  .erp-chart-title{font-size:14px;color:var(--text);font-weight:600;margin:20px 2px 4px}
  .erp-chart-sub{font-size:12px;color:var(--muted);margin:0 2px 6px}
  .erp-chart{width:100%;height:300px}
  @media(max-width:600px){.erp-chart{height:250px}.erp-custom input{width:96px}}
  @media (max-width:600px){
    .wrap{padding:14px 12px 40px}.chart{height:280px}
    .card{padding:14px 15px;border-radius:14px}.card .val{font-size:24px}
  }
  .agri-acc{grid-column:1/-1;background:var(--card);border:1px solid var(--navy);border-radius:16px;padding:10px 14px;margin-top:-4px}
  .agri-sub{font-size:12.5px;color:var(--sec);margin:4px 2px 6px}

  /* ===== 技术指标分析 ===== */
  .wrap.wide{max-width:1180px}
  .tech-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:6px 0 4px}
  .tech-bar .lab{font-size:13px;color:var(--sec)}
  .tech-bar input[type=date],.tech-bar input[type=number],.tech-q{border:1px solid var(--border2);border-radius:10px;
    padding:6px 10px;font-size:13px;font-family:inherit;color:var(--text);background:var(--card)}
  .tech-bar input[type=number]{width:70px}
  .tech-btn{border:1px solid var(--border2);background:var(--card);color:var(--sec);padding:6px 12px;font-size:13px;
    border-radius:999px;cursor:pointer;white-space:nowrap}
  .tech-btn:disabled{opacity:.4;cursor:default}
  .tech-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tech-hist{background:#fff6e0;border:1px solid #f0d9a0;color:#8a5200;border-radius:10px;padding:6px 12px;font-size:12.5px;margin:6px 0}
  .tech-note{font-size:12px;color:var(--muted);margin:4px 2px}
  .tech-warn{font-size:12.5px;color:#8a5200;margin:4px 2px}
  .tech-panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  @media (max-width:760px){.tech-panels{grid-template-columns:1fr}}
  .tech-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);min-height:120px;max-height:420px;overflow:auto}
  .tech-panel h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
  .tech-panel h3 .cnt{font-size:12px;color:var(--muted);font-weight:400}
  .tech-grp{font-size:12px;font-weight:700;margin:10px 0 4px}
  .tech-grp.g{color:var(--up)} .tech-grp.d{color:var(--down)}
  .tech-it{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
  .tech-it:last-child{border-bottom:none}
  .tech-it .nm{font-weight:600}
  .tech-it .cd{font-size:11.5px;color:var(--muted)}
  .tech-it .rt{margin-left:auto;font-size:12px;color:var(--sec);white-space:nowrap}
  .tech-it .tg{font-size:11px;border:1px solid var(--border2);border-radius:999px;padding:0 7px;color:var(--sec)}
  .tech-it .arrow{color:var(--muted)}
  .st{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .st-vs{background:#f4b8b4;color:#8f1d19} .st-s{background:#fbd5d2;color:#a3302b}
  .st-ns{background:#fde8cc;color:#8a5200} .st-nw{background:#eeeccc;color:#6b6a2a}
  .st-w{background:#d6ecd6;color:#2d6e2d}  .st-vw{background:#b9e0b9;color:#1f5a1f} .st-x{background:#eee;color:#666}
  .tech-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
  .tech-chip{border:1px solid var(--border2);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;
    cursor:pointer;color:var(--sec);white-space:nowrap}
  .tech-chip.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);color:var(--text);font-weight:600}
  .tech-chip .n{font-size:12px;color:var(--muted);margin-left:4px}
  .tech-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:4px 0 8px;font-size:13px;color:var(--sec)}
  .tech-q{width:180px}
  #techTbl th{cursor:pointer;user-select:none}
  #techTbl th.on::after{content:attr(data-arrow);margin-left:3px;color:var(--navy)}
  #techTbl td small{color:var(--muted);font-size:11.5px;display:block}
  #techTbl .stale{font-size:11px;color:#8a5200;background:#fff6e0;border-radius:6px;padding:0 5px;margin-left:5px}
  #techTbl .star{color:#e0a53b;margin-left:3px}
  #techTbl tr.sw td{background:#fbfaf5}
  .tech-hint{font-size:11.5px;color:var(--muted);margin:2px 2px 8px}

  /* ===== 股票池管理 ===== */
  .pool-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin:8px 0;font-size:13px}
  .pool-box h4{margin:0 0 6px;font-size:13.5px}
  .pool-box ol{margin:6px 0 8px 18px;padding:0;color:var(--sec);line-height:1.7}
  .pool-box input[type=password],.pool-box input[type=text],.pool-box textarea,.pool-in{border:1px solid var(--border2);border-radius:10px;
    padding:7px 10px;font-size:13px;font-family:inherit;color:var(--text);background:#fff}
  .pool-box input[type=password]{width:min(420px,100%)}
  .pool-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pool-in{width:150px} .pool-in.nm{width:170px}
  .tech-btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
  .tech-btn.dng{color:var(--up);border-color:#e8b9b6}
  .pool-pending{background:#fff6e0;border:1px solid #f0d9a0;border-radius:12px;padding:8px 14px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:#8a5200}
  .pool-msg{border-radius:10px;padding:8px 14px;margin:8px 0;font-size:13px}
  .pool-msg.ok{background:#e6f4ea;border:1px solid #b9dfc3;color:#1e6b34}
  .pool-msg.err{background:#fdeceb;border:1px solid #f1bdb9;color:#a3302b}
  .pool-tag{font-size:11.5px;border-radius:999px;padding:1px 8px;white-space:nowrap}
  .pool-tag.ok{background:#e6f4ea;color:#1e6b34} .pool-tag.wait{background:#fff6e0;color:#8a5200}
  .pool-tag.off{background:#eee;color:#777} .pool-tag.del{background:#fdeceb;color:#a3302b}
  .pool-tag.new{background:#e3eefc;color:#1b5cb8}
  #poolTbl tr.pdel td{opacity:.55;text-decoration:line-through}
  #poolTbl td:last-child,#poolTbl th:last-child{text-align:right}
  .pool-prev td,.pool-prev th,#poolTbl td,#poolTbl th{text-align:left}
  #poolTbl td:last-child,#poolTbl th:last-child{text-align:right}
  .pool-star{cursor:pointer;color:#c9c5b8;font-size:16px;border:none;background:none;padding:0 6px}
  .pool-star.on{color:#e0a53b}
  .pool-modal{position:fixed;inset:0;background:rgba(20,24,32,.45);display:flex;align-items:flex-start;justify-content:center;
    padding:5vh 12px;z-index:50;overflow:auto}
  .pool-modal[hidden]{display:none}
  .pool-card{background:var(--card);border-radius:16px;padding:18px 20px;width:min(760px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .pool-card h3{margin:0 0 4px;font-size:16px}
  .pool-card textarea{width:100%;height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .pool-prev{max-height:280px;overflow:auto;margin-top:10px;border:1px solid var(--border);border-radius:10px}
  .pool-prev table{min-width:0}
</style>
</head>
<body>
<header>
  <h1>投资数据看板</h1>
  <div class="sub" id="subhead" style="display:none">加载中…</div>
</header>
<div class="ind-bar" id="indBar"></div>
<div class="wrap">
  <div class="sub-bar" id="subBar"></div>
  <div class="pane" id="pane"></div>
</div>

<script>
// ====== 数据加载：内嵌优先，否则 fetch。上线版 EMBEDDED 置空则全部走 fetch ======
const EMBEDDED = {};
async function loadJSON(path){
  if(path in EMBEDDED) return JSON.parse(JSON.stringify(EMBEDDED[path]));
  const r = await fetch(path);
  if(!r.ok) throw new Error(path+" 加载失败 "+r.status);
  return r.json();
}
const _cache = {};
async function loadCached(url){
  if(url in _cache) return _cache[url];
  const v = await loadJSON(url); _cache[url] = v; return v;
}

// ================== 电解铝（大宗商品）部分 —— 保持原逻辑 ==================
const CAT_NAME = {price:"价格", cost:"成本", inventory:"库存"};
const CAT_ORDER = ["price","cost","inventory"];
const RANGES = [["1m","近1月",30],["6m","近6月",180],["1y","近1年",365],["all","全部",null]];
const SERIES_COLORS = ["#2a6fdb","#1d9e75","#ba7517","#8a5cd1","#d4537e"];

let MODULES = [];
let curTop = null;                 // 当前一级：模块id 或 "erp"
let curMod = null, curSub = null, curRange = "1m";
let chart = null;

function chgClass(v){ return v>0?"up":(v<0?"down":"flat"); }
function chgText(v,dp){ if(v==null) return "—"; const s=v>0?"▲ +":(v<0?"▼ ":"— "); return s+(v===0?"0":v.toFixed(dp)); }
function dotColor(m){
  if(m.last_ingest && m.last_ingest.status==="failed") return "var(--up)";
  if(!m.latest) return "var(--muted)";
  return "var(--down)";
}

async function boot(){
  try{
    const md = await loadJSON("api/modules.json");
    MODULES = md.modules || [];
    document.getElementById("subhead").textContent = "";
  }catch(e){ MODULES = []; document.getElementById("subhead").textContent = ""; }
  renderIndBar();
  selectErp();   // 默认打开股权溢价指数（放首位）
}

function renderIndBar(){
  const bar = document.getElementById("indBar");
  bar.innerHTML = "";
  const e=document.createElement("button");   // 股权溢价指数放首位
  e.className="ind-btn"+(curTop==="erp"?" on":"");
  e.textContent="指数估值"; e.onclick=()=>selectErp();
  bar.appendChild(e);
  MODULES.forEach(m=>{                          // 大宗模块（电解铝）其次
    const b=document.createElement("button");
    b.className="ind-btn"+(curTop===m.id?" on":"");
    b.textContent=m.name; b.onclick=()=>selectModule(m.id);
    bar.appendChild(b);
  });
  const mt=document.createElement("button");    // 金属模块
  mt.className="ind-btn"+(curTop==="metals"?" on":"");
  mt.textContent="金属"; mt.onclick=()=>selectMetals();
  bar.appendChild(mt);
  const ag=document.createElement("button");    // 农产品模块
  ag.className="ind-btn"+(curTop==="agri"?" on":"");
  ag.textContent="农产品"; ag.onclick=()=>selectAgri();
  bar.appendChild(ag);
  const tc=document.createElement("button");    // 技术指标分析模块
  tc.className="ind-btn"+(curTop==="tech"?" on":"");
  tc.textContent="技术指标分析"; tc.onclick=()=>selectTech();
  bar.appendChild(tc);
  document.querySelector(".wrap").classList.toggle("wide", curTop==="tech");
}

async function selectModule(id){
  curTop=id; curMod=id; chart=null; erpCharts=[];
  renderIndBar();
  const mod = MODULES.find(m=>m.id===id);
  const cats = CAT_ORDER.filter(c=> mod.metrics.some(x=>x.category===c));
  const subs = ["overview"].concat(cats);
  curSub = subs[0];
  renderSubBar(subs);
  renderPane();
}

function renderSubBar(subs){
  const bar=document.getElementById("subBar");
  bar.innerHTML="";
  subs.forEach(s=>{
    const b=document.createElement("button");
    b.className="sub-btn"+(s===curSub?" on":"");
    b.textContent = s==="overview" ? "概览" : (CAT_NAME[s]||s);
    b.onclick=()=>{ curSub=s; renderSubBar(subs); renderPane(); };
    bar.appendChild(b);
  });
}

async function renderPane(){
  const pane=document.getElementById("pane");
  chart=null;
  if(curSub==="overview"){ await renderOverview(pane); }
  else { await renderCategory(pane, curSub); }
}

async function renderOverview(pane){
  const ov = await loadJSON("api/overview/"+curMod+".json");
  const byCat={};
  ov.metrics.forEach(m=>{ if(m.hide_overview) return; (byCat[m.category]=byCat[m.category]||[]).push(m); });
  let html="";
  CAT_ORDER.filter(c=>byCat[c]).forEach(c=>{
    html += '<div class="grp-title">'+(CAT_NAME[c]||c)+'</div><div class="grid">';
    byCat[c].forEach(m=>{
      const L=m.latest; const dp = m.unit==="万吨"?1:0;
      html += '<div class="card"><div class="top"><span class="nm">'+m.name+
        '</span><span class="dot" style="background:'+dotColor(m)+'"></span></div>';
      if(L){
        html += '<div><span class="val">'+L.value.toLocaleString()+'</span> <span class="u">'+m.unit+'</span></div>';
        const chgVal = (L.mom!=null ? L.mom : (L.src_change!=null ? L.src_change : null));
        if(L.region){
          html += '<div class="meta-line">'+L.region+' · <span class="'+chgClass(chgVal)+'">'+chgText(chgVal,dp)+'</span></div>';
        } else { html += '<div class="chg '+chgClass(chgVal)+'">'+chgText(chgVal,dp)+'</div>'; }
        if(L.yoy!=null) html+='<div class="yoy">同比 '+chgText(L.yoy,dp)+'</div>';
      } else { html+='<div class="val" style="color:var(--muted)">暂无</div>'; }
      html += '</div>';
    });
    html+='</div>';
  });
  pane.innerHTML = html || '<div class="empty">暂无数据</div>';
}

async function renderCategory(pane, cat){
  const mod = MODULES.find(m=>m.id===curMod);
  const metrics = mod.metrics.filter(x=>x.category===cat);
  let html='<div class="ranges">';
  RANGES.forEach(([k,label])=> html+='<span class="rg'+(k===curRange?" on":"")+'" data-r="'+k+'">'+label+'</span>');
  html+='</div><div class="chart" id="chart"></div><div class="tbl-wrap" id="tbl"></div>';
  pane.innerHTML=html;
  pane.querySelectorAll(".rg").forEach(el=> el.onclick=()=>{ curRange=el.dataset.r; renderCategory(pane,cat); });

  const useFull = (curRange !== "1m");
  const seriesData = {};
  for(const m of metrics){
    const url = "api/series/"+m.id+(useFull?".full":"")+".json";
    const s = await loadCached(url); seriesData[m.id] = (s && s.points) || [];
  }
  const cutoff = rangeCutoff(curRange);
  const dp = metrics[0] && metrics[0].unit==="万吨"?1:0;
  const dateSet=new Set();
  metrics.forEach(m=> seriesData[m.id].forEach(p=>{ if(!cutoff||p.date>=cutoff) dateSet.add(p.date); }));
  const dates=[...dateSet].sort();
  const chartMetrics = metrics.filter(m=> !m.hide_chart);
  drawChart(chartMetrics, seriesData, dates, dp);
  drawTable(metrics, seriesData, dates, dp);
}

function rangeCutoff(k){
  const days={"1m":30,"6m":180,"1y":365,"all":null}[k];
  if(!days) return null;
  const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10);
}

function drawChart(metrics, seriesData, dates, dp){
  const el=document.getElementById("chart"); chart=echarts.init(el);
  const series=metrics.map((m,i)=>{
    const map={}; seriesData[m.id].forEach(p=>map[p.date]=p.value);
    return {name:m.name, type:"line", smooth:false, showSymbol:true, symbolSize:4,
      lineStyle:{width:2}, itemStyle:{color:SERIES_COLORS[i%SERIES_COLORS.length]},
      data:dates.map(d=> d in map?map[d]:null), connectNulls:true};
  });
  chart.setOption({
    grid:{left:8,right:12,top:36,bottom:24,containLabel:true},
    legend:{top:0, data:metrics.map(m=>m.name), icon:"roundRect", itemWidth:14, itemHeight:3},
    tooltip:{trigger:"axis", valueFormatter:v=> v==null?"—":v.toFixed(dp)},
    xAxis:{type:"category", data:dates, boundaryGap:false,
      axisLabel:{color:"#888", formatter:v=>v.slice(5)}, axisLine:{lineStyle:{color:"#ddd"}}},
    yAxis:{type:"value", scale:true, splitLine:{lineStyle:{color:"#eee"}}, axisLabel:{color:"#888"}},
    series: series,
  });
}

function drawTable(metrics, seriesData, dates, dp){
  const maps={}; metrics.forEach(m=>{ maps[m.id]={}; seriesData[m.id].forEach(p=>maps[m.id][p.date]=p); });
  let h='<table><thead><tr><th>日期</th>';
  metrics.forEach(m=> h+='<th>'+m.name+'</th>'); h+='</tr></thead><tbody>';
  [...dates].reverse().forEach(d=>{
    h+='<tr><td>'+d+'</td>';
    metrics.forEach(m=>{
      const p=maps[m.id][d];
      if(!p){ h+='<td>—</td>'; return; }
      const c=p.change;
      const chg = c==null?"":' <span class="'+chgClass(c)+'">('+(c>0?"+":"")+(c===0?"0":c.toFixed(dp))+')</span>';
      h+='<td>'+p.value.toLocaleString()+chg+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  document.getElementById("tbl").innerHTML=h;
}

function valCard(lab, L, compMed, pc){

    '<div><span class="val">'+(L&&L.value!=null?L.value.toFixed(2):"—")+'</span></div>'+

// 显示范围裁剪
function valCutoff(){
  if(valCustom && valCustom.start) return valCustom.start;
  if(valRange==="all") return "0000-01-01";
  if(valRange==="ytd") return (new Date().getFullYear())+"-01-01";
  const days={"1m":30,"3m":92,"1y":366,"3y":1096,"5y":1827}[valRange];
  const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10);
}
function valEnd(){ return (valCustom&&valCustom.end)?valCustom.end:"9999-12-31"; }
function fltRange(pts){ const a=valCutoff(),b=valEnd(); return pts.filter(p=> p.date>=a && p.date<=b); }

// ERP 当前值百分位（前端直接从全量历史算）
function _posWithin(points, latest, years){
  let cut="0000-01-01";
  if(years){ const d=new Date(); d.setDate(d.getDate()-Math.round(365*years)); cut=d.toISOString().slice(0,10); }
  const vals=points.filter(p=>p.date>=cut).map(p=>p.value).filter(v=>v!=null).sort((a,b)=>a-b);
  if(!vals.length) return null;
  const below=vals.filter(v=>v<=latest).length;
  return below/vals.length;
}
function erpAbsClass(v){ return v==null?"flat":(v>=6?"down":(v<=3?"up":"flat")); }  // 高=便宜=绿(down)，低=贵=红(up)

// —— 单金属页：走势图（同量纲同轴，不同量纲用左右双轴）——
async function renderMetalsChart(pane, metalId){
  const g = metalsOv.metals.find(x=>x.id===metalId);
  const metrics = g.metrics.filter(m=> !m.hide_chart);   // 库存类不上价格图
  let html='<div class="ranges">';
  METALS_RANGES.forEach(([k,label])=> html+='<span class="rg'+(k===metalsRange?" on":"")+'" data-r="'+k+'">'+label+'</span>');
  html+='</div><div class="chart" id="metalsChart"></div><div class="tbl-wrap" id="metalsTbl"></div>';
  pane.innerHTML=html;
  pane.querySelectorAll(".rg").forEach(el=> el.onclick=()=>{ metalsRange=el.dataset.r; renderMetalsChart(pane,metalId); });

  const useFull = (metalsRange==="1y"||metalsRange==="all");
  const seriesData={};
  for(const m of metrics){
    const s = await loadCached("metals_api/series/"+m.id+(useFull?".full":"")+".json");
    seriesData[m.id] = (s&&s.points)||[];
  }
  const cutoff = rangeCutoff(metalsRange);
  const dateSet=new Set();
  metrics.forEach(m=> seriesData[m.id].forEach(p=>{ if(!cutoff||p.date>=cutoff) dateSet.add(p.date); }));
  const dates=[...dateSet].sort();

  // 按单位分配 y 轴（最多两个）
  const units=[]; metrics.forEach(m=>{ if(!units.includes(m.unit)) units.push(m.unit); });
  const yAxis = units.slice(0,2).map((u,i)=>({type:"value",scale:true,name:u,position:i===0?"left":"right",
    splitLine:{show:i===0,lineStyle:{color:"#eee"}},axisLabel:{color:"#888"}}));
  const series = metrics.map((m,i)=>{
    const map={}; seriesData[m.id].forEach(p=>map[p.date]=p.value);
    const axi = units.indexOf(m.unit); 
    return {name:m.name,type:"line",yAxisIndex:(axi>1?1:axi),showSymbol:false,lineStyle:{width:2},
      itemStyle:{color:SERIES_COLORS[i%SERIES_COLORS.length]},
      data:dates.map(d=> d in map?map[d]:null),connectNulls:true};
  });
  metalsChart=echarts.init(document.getElementById("metalsChart"));
  metalsChart.setOption({
    grid:{left:8,right:units.length>1?12:12,top:36,bottom:24,containLabel:true},
    legend:{top:0,data:metrics.map(m=>m.name),icon:"roundRect",itemWidth:14,itemHeight:3},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:dates,boundaryGap:false,axisLabel:{color:"#888",formatter:v=>v.slice(2,7)},axisLine:{lineStyle:{color:"#ddd"}}},
    yAxis: yAxis.length?yAxis:[{type:"value",scale:true}],
    series: series,
  });
  drawMetalsTable(metrics, seriesData, dates);
}

// 走势页表格：日期 + 各指标当日值（金/铜=收盘价，锂=各价中间价），跟随时间范围
function drawMetalsTable(metrics, seriesData, dates){
  const maps={}; metrics.forEach(m=>{ maps[m.id]={}; (seriesData[m.id]||[]).forEach(p=>maps[m.id][p.date]=p.value); });
  let h='<table><thead><tr><th>日期</th>';
  metrics.forEach(m=> h+='<th>'+m.name+'</th>');
  h+='</tr></thead><tbody>';
  [...dates].reverse().forEach(d=>{
    h+='<tr><td>'+d+'</td>';
    metrics.forEach(m=>{
      const v=maps[m.id][d];
      h+='<td>'+(v==null?'—':v.toLocaleString(undefined,{minimumFractionDigits:metalDp(m.unit),maximumFractionDigits:metalDp(m.unit)}))+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  document.getElementById("metalsTbl").innerHTML=h;
}

function agriPctEst(v,p20,p50,p80){
  if(v==null||p20==null||p50==null) return null;
  if(v<=p20) return 0.15;                                   // 20分位以下
  if(v<=p50) return 0.2+(v-p20)/((p50-p20)||1)*0.3;
  if(p80!=null && v<=p80) return 0.5+(v-p50)/((p80-p50)||1)*0.3;
  return 0.9;
}

// ---- CSV ----
function csvParse(text){
  text=text.replace(/^﻿/,""); const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=""; rows.push(row); row=[]; }
    else cur+=c; }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function csvField(v){ v=String(v==null?"":v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function poolReadCsv(text){
  const rows=csvParse(text), hdr=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
  const ic=hdr.indexOf("code"), inm=hdr.indexOf("name"), ifo=hdr.indexOf("focus"), seen=new Set(), out=[];
  rows.forEach(r=>{ const code=(r[ic]||"").trim().toUpperCase(); if(!code||seen.has(code)) return; seen.add(code);
    out.push({code,name:(inm>=0?(r[inm]||""):"").trim(),focus:(ifo>=0&&["1","是","true","y"].includes((r[ifo]||"").trim().toLowerCase()))?1:0}); });
  return out;
}
function poolToCsv(list){ return "﻿code,name,focus\n"+list.map(r=>[r.code,r.name,r.focus?1:0].map(csvField).join(",")).join("\n")+"\n"; }
function poolApplyOps(list,ops){
  const m=new Map(list.map(r=>[r.code,Object.assign({},r)]));
  Object.keys(ops.remove).forEach(c=>m.delete(c));
  Object.entries(ops.add).forEach(([c,v])=>{ const ex=m.get(c);
    if(ex){ if(v.name) ex.name=v.name; if(v.focus) ex.focus=1; } else m.set(c,{code:c,name:v.name||"",focus:v.focus?1:0}); });
  Object.entries(ops.focus).forEach(([c,f])=>{ const ex=m.get(c); if(ex) ex.focus=f?1:0; });
  return [...m.values()];
}

// ---- 代码规范化：支持 600031 / sh600031 / 600031.SS / 700 / HK00700 / 00700.HK ----
function poolNormCode(t){
  t=String(t||"").trim().replace(/^["']|["']$/g,"").toUpperCase(); if(!t) return {err:"空"};
  let m;
  if((m=t.match(/^(\d{6})\.(SH|SZ|BJ)$/))) return {code:t};
  if((m=t.match(/^(\d{6})\.SS$/))) return {code:m[1]+".SH"};
  if((m=t.match(/^(SH|SZ|BJ)(\d{6})$/))) return {code:m[2]+"."+m[1]};
  if((m=t.match(/^(\d{1,5})\.HK$/))) return {code:m[1].padStart(5,"0")+".HK"};
  if((m=t.match(/^HK(\d{1,5})$/))) return {code:m[1].padStart(5,"0")+".HK"};
  if(/^\d{6}$/.test(t)){ const d=t[0];
    if(d==="6") return {code:t+".SH"}; if(d==="0"||d==="3") return {code:t+".SZ"}; if(d==="4"||d==="8"||d==="9") return {code:t+".BJ"};
    return {err:"无法判断交易所（基金/ETF 暂不支持）"}; }
  if(/^\d{1,5}$/.test(t)) return {code:t.padStart(5,"0")+".HK"};
  return {err:"不是有效的股票代码"};
}
// ---- 批量导入解析：CSV/文本行、纯代码、stock_list.yaml 都支持 ----
function poolParseImport(text){
  const items=[]; let pend=null;
  const flush=()=>{ if(pend){ items.push(pend); pend=null; } };
  const flagSet=new Set(["1","★","是","重点","focus","true"]);
  text.replace(/^﻿/,"").split(/\r?\n/).forEach(line=>{
    const raw=line; line=line.replace(/#.*$/,"").trim(); if(!line) return;
    if(/^(a_share|hk_stock)\s*:\s*$/i.test(line)) return;
    let m;
    if((m=line.match(/^-?\s*code\s*:\s*["']?([^"'\s,]+)["']?/i))){ flush(); pend={raw,codeRaw:m[1],name:"",focus:0}; return; }
    if((m=line.match(/^name\s*:\s*["']?(.*?)["']?\s*$/i)) && pend){ pend.name=m[1]; flush(); return; }
    if(/^(code|代码|股票代码)\s*[,，\t]/i.test(line)) return;   // 表头行（英文/中文）
    flush();
    let tok=line.split(/[,，\t;；\s]+/).filter(Boolean), focus=0;
    if(tok.length>1 && flagSet.has(tok[tok.length-1].toLowerCase())){ focus=1; tok=tok.slice(0,-1); }
    if(tok.length>1 && tok.every(t=>poolNormCode(t).code)){ tok.forEach(t=>items.push({raw,codeRaw:t,name:"",focus})); return; }
    items.push({raw,codeRaw:tok[0],name:tok.slice(1).join(" "),focus});
  });
  flush();
  const seen=new Set();
  return items.map(it=>{ const n=poolNormCode(it.codeRaw); const o={codeRaw:it.codeRaw,name:it.name,focus:it.focus};
    if(n.err){ o.status="invalid"; o.note=n.err; return o; }
    o.code=n.code; if(!POOL_CODE_RE.test(o.code)){ o.status="invalid"; o.note="代码格式不对"; return o; }
    if(seen.has(o.code)){ o.status="dup"; o.note="本次导入里重复"; return o; }
    seen.add(o.code);
    const ex=techStockList.find(x=>x.code===o.code);
    const pendingAdd=poolOps.add[o.code], pendingRm=poolOps.remove[o.code];
    if(pendingAdd){ o.status="exists"; o.note="已在待提交的新增里"; }
    else if(ex&&ex.enabled&&!pendingRm){ o.status="exists"; o.note="已在股票池中，跳过"; }
    else if(ex&&(!ex.enabled||pendingRm)){ o.status="restore"; o.note="之前删除过，将恢复（历史数据保留）"; if(!o.name) o.name=ex.name; }
    else o.status="new";
    return o; });
}

// ---- 暂存修改 ----
function poolExisting(code){ return techStockList.find(x=>x.code===code); }
function poolStageAdd(code,name,focus){
  if(poolOps.remove[code]){ delete poolOps.remove[code]; return "restored"; }
  const ex=poolExisting(code); if(ex&&ex.enabled) return "exists";
  poolOps.add[code]={name:name||"",focus:focus?1:0}; return "added";
}
function poolStageRemove(code){
  if(poolOps.add[code]){ delete poolOps.add[code]; return; }
  delete poolOps.focus[code];
  const ex=poolExisting(code); if(ex&&ex.enabled) poolOps.remove[code]=1;
}
function poolStageFocus(code,f){
  if(poolOps.add[code]){ poolOps.add[code].focus=f?1:0; return; }
  const ex=poolExisting(code); if(ex&&!!ex.focus===!!f) delete poolOps.focus[code]; else poolOps.focus[code]=f?1:0;
}
function poolPendingCount(){ return Object.keys(poolOps.add).length+Object.keys(poolOps.remove).length+Object.keys(poolOps.focus).length; }

// ---- GitHub 读写 ----
async function ghFetch(path,opts){
  opts=opts||{}; const h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+ghToken(),"X-GitHub-Api-Version":"2022-11-28"};
  if(opts.body) h["Content-Type"]="application/json";
  return fetch("https://api.github.com"+path,Object.assign({},opts,{headers:h}));
}
function ghErr(status){
  if(status===401) return "令牌无效或已过期，请重新设置令牌。";
  if(status===403) return "权限不足：令牌需要这个仓库的 Contents: Read and write 权限。";
  if(status===404) return "找不到文件或令牌无权访问仓库 "+GH_OWNER+"/"+GH_REPO+"（创建令牌时要选中这个仓库）。";
  return "GitHub 返回 HTTP "+status+"。";
}
async function poolVerifyToken(){
  const r=await ghFetch("/repos/"+GH_OWNER+"/"+GH_REPO);
  if(!r.ok) throw new Error(ghErr(r.status));
  const j=await r.json(); if(!j.permissions||!j.permissions.push) throw new Error("令牌只有只读权限，需要 Contents: Read and write。");
}
async function poolSave(){
  if(poolBusy||!poolPendingCount()) return;
  if(!ghToken()){ poolShowToken=true; poolMsg={t:"err",m:"请先设置 GitHub 令牌，然后再点保存。"}; renderTechPool(document.getElementById("pane")); return; }
  poolBusy=true; poolMsg={t:"ok",m:"正在提交到 GitHub…"}; renderTechPool(document.getElementById("pane"));
  try{
    const nA=Object.keys(poolOps.add).length, nR=Object.keys(poolOps.remove).length, nF=Object.keys(poolOps.focus).length;
    let done=null;
    for(let attempt=0;attempt<3&&!done;attempt++){
      const g=await ghFetch("/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+GH_PATH);
      if(!g.ok) throw new Error(ghErr(g.status));
      const cur=await g.json();
      const list=poolApplyOps(poolReadCsv(b64dec(cur.content)),poolOps);
      if(!list.length) throw new Error("提交后股票池会变成空的，已拒绝（至少保留一只股票）。");
      const parts=[]; if(nA) parts.push("+"+nA); if(nR) parts.push("-"+nR); if(nF) parts.push("★"+nF);
      const put=await ghFetch("/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+GH_PATH,{method:"PUT",
        body:JSON.stringify({message:"tech pool: "+parts.join(" ")+" (via web)",content:b64enc(poolToCsv(list)),sha:cur.sha})});
      if(put.status===409||put.status===422) continue;      // 文件在期间被改过，重新读取后再套用一次
      if(!put.ok) throw new Error(ghErr(put.status));
      done=await put.json();
    }
    if(!done) throw new Error("文件在提交过程中被反复修改，请稍后重试。");
    const today=new Date().toISOString().slice(0,10);
    Object.keys(poolOps.remove).forEach(c=>{ const x=poolExisting(c); if(x){ x.enabled=0; x.removed_at=today; } });
    Object.entries(poolOps.add).forEach(([c,v])=>{ const x=poolExisting(c);
      if(x){ x.enabled=1; x.removed_at=null; if(v.name) x.name=v.name; if(v.focus) x.focus=1; }
      else techStockList.push({code:c,name:v.name||"",market:c.endsWith(".HK")?"HK":"A",focus:v.focus?1:0,enabled:1,added_at:today,removed_at:null,has_data:false}); });
    Object.entries(poolOps.focus).forEach(([c,f])=>{ const x=poolExisting(c); if(x) x.focus=f?1:0; });
    techStockList.forEach(x=>techStocks[x.code]=x);
    poolOps={add:{},remove:{},focus:{}};
    const url=(done.commit&&done.commit.html_url)||"";
    poolMsg={t:"ok",m:"已提交到 GitHub。tech-daily 会自动运行，大约 5 分钟后刷新本页就能看到新股票的数据；在此之前新增的股票显示“待计算”。",
      link:url, actions:"https://github.com/"+GH_OWNER+"/"+GH_REPO+"/actions/workflows/tech-daily.yml"};
  }catch(e){ poolMsg={t:"err",m:"保存失败："+e.message}; }
  poolBusy=false; renderTechPool(document.getElementById("pane"));
}

// ---- 渲染 ----
function poolView(){
  const rows=[], rm=poolOps.remove, ad=poolOps.add, fo=poolOps.focus, short=(techMeta&&techMeta.status&&techMeta.status.short)||{};
  Object.entries(ad).forEach(([c,v])=>{ const ex=poolExisting(c);
    rows.push({code:c,name:v.name||(ex&&ex.name)||"",market:c.endsWith(".HK")?"HK":"A",focus:v.focus,added_at:"",tag:ex?["new","待恢复"]:["new","待添加"],pending:true,cls:""}); });
  techStockList.forEach(s=>{
    if(ad[s.code]) return;
    const foc=(s.code in fo)?fo[s.code]:s.focus;
    let tag, cls="";
    if(rm[s.code]){ tag=["del","待删除"]; cls="pdel"; }
    else if(!s.enabled) tag=["off","已停用"];
    else if(short[s.code]) tag=["wait","新股·K线不足"];
    else if(!s.has_data) tag=["wait","待计算"];
    else tag=["ok","正常"];
    rows.push({code:s.code,name:s.name,market:s.market,focus:foc,added_at:s.added_at,removed_at:s.removed_at,tag,cls,enabled:s.enabled,pending:!!rm[s.code]||(s.code in fo)});
  });
  return rows;
}
function poolRenderTable(){
  const q=poolQ.trim().toLowerCase(); let rows=poolView();
  const fl=poolFilter;
  rows=rows.filter(r=>(!q||(r.name||"").toLowerCase().includes(q)||r.code.toLowerCase().includes(q))&&
    (fl==="all"||(fl==="on"&&r.tag[1]!=="已停用")||(fl==="off"&&r.tag[1]==="已停用")||(fl==="wait"&&/待|不足/.test(r.tag[1]))||(fl==="focus"&&r.focus)));
  let h='<thead><tr><th>名称 / 代码</th><th>市场</th><th>状态</th><th>加入日期</th><th>重点</th><th>操作</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const isDel=r.tag[1]==="待删除", isOff=r.tag[1]==="已停用";
    const act=isDel?'<button class="tech-btn" data-a="undo" data-c="'+esc(r.code)+'">撤销</button>':
      (isOff?'<button class="tech-btn" data-a="restore" data-c="'+esc(r.code)+'">恢复</button>':
      '<button class="tech-btn dng" data-a="del" data-c="'+esc(r.code)+'">删除</button>');
    h+='<tr class="'+r.cls+'"><td>'+esc(r.name||r.code)+'<small style="display:block;color:var(--muted);font-size:11.5px">'+esc(r.code)+'</small></td>'+
      '<td>'+(r.market==="HK"?"港股":"A股")+'</td><td><span class="pool-tag '+r.tag[0]+'">'+r.tag[1]+'</span>'+
      (isOff&&r.removed_at?'<small style="display:block;color:var(--muted)">'+esc(r.removed_at)+'</small>':'')+'</td>'+
      '<td>'+esc(r.added_at||"")+'</td>'+
      '<td><button class="pool-star'+(r.focus?" on":"")+'" data-a="star" data-c="'+esc(r.code)+'" title="标记重点关注">'+(r.focus?"★":"☆")+'</button></td><td>'+act+'</td></tr>';
  });
  if(!rows.length) h+='<tr><td colspan="6" class="empty">没有符合条件的股票</td></tr>';
  const t=document.getElementById("poolTbl"); t.innerHTML=h+'</tbody>';
  document.getElementById("poolCnt").textContent="显示 "+rows.length+" 只";
  t.querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>{
    const c=b.dataset.c, a=b.dataset.a;
    if(a==="del") poolStageRemove(c);
    else if(a==="undo") delete poolOps.remove[c];
    else if(a==="restore") poolStageAdd(c,"",0);
    else if(a==="star"){ const v=poolView().find(x=>x.code===c); poolStageFocus(c,!(v&&v.focus)); }
    poolMsg=null; renderTechPool(document.getElementById("pane"));
  });
}

  if(!techStockList.length){ pane.innerHTML='<div class="empty">'+esc(techErr||"股票池数据还没有生成，请先运行一次 tech-daily。")+'</div>'; return; }
  const view=poolView(), nOn=view.filter(r=>r.tag[1]!=="已停用").length, nOff=view.length-nOn;
  const tok=!!ghToken(), nA=Object.keys(poolOps.add).length, nR=Object.keys(poolOps.remove).length, nF=Object.keys(poolOps.focus).length, np=poolPendingCount();
  let h='<div class="pool-row" style="margin:6px 0"><span class="lab" style="font-size:13px;color:var(--sec)">共 '+nOn+' 只启用'+(nOff?'，'+nOff+' 只已停用（历史保留）':'')+'</span>'+
    '<span style="margin-left:auto" class="pool-row"><span class="pool-tag '+(tok?'ok':'off')+'">'+(tok?'GitHub 令牌已设置':'未设置令牌')+'</span>'+
    '<button class="tech-btn" id="pTokBtn">'+(tok?'更换/清除令牌':'设置令牌')+'</button></span></div>';

      '<li>打开 GitHub → 右上角头像 → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>'+
      '<li>Repository access 选 <b>Only select repositories</b>，只选 <b>'+GH_REPO+'</b></li>'+

      (tok?'<button class="tech-btn dng" id="pTokClear">清除已保存的令牌</button>':'')+'</div>'+
      '<div class="tech-note">令牌只存在本浏览器的 localStorage，不会发给除 GitHub 以外的任何地方。请勿在公用电脑上保存；随时可在 GitHub 里撤销。</div></div>';
  }
  if(poolMsg) h+='<div class="pool-msg '+poolMsg.t+'">'+esc(poolMsg.m)+
    (poolMsg.link?' <a href="'+esc(poolMsg.link)+'" target="_blank" rel="noopener">查看提交</a>':'')+
    (poolMsg.actions?' · <a href="'+esc(poolMsg.actions)+'" target="_blank" rel="noopener">查看运行进度</a>':'')+'</div>';
  h+='<div class="pool-box"><div class="pool-row"><b style="font-size:13px">添加股票</b>'+
    '<input class="pool-in" id="pCode" placeholder="代码，如 600031 / 00700"><input class="pool-in nm" id="pName" placeholder="名称（可不填，自动补）">'+
    '<label style="font-size:13px"><input type="checkbox" id="pFocus"> 重点</label>'+
    '<button class="tech-btn pri" id="pAdd">添加</button><button class="tech-btn" id="pImport" style="margin-left:auto">批量导入…</button></div>'+
    '<div class="tech-note">代码可以只写数字（自动判断沪/深/北/港），也支持 sh600031、600031.SS、HK00700 等写法。</div></div>';
  if(np) h+='<div class="pool-pending"><b>待提交 '+np+' 项修改</b><span>'+(nA?'新增 '+nA+'　':'')+(nR?'删除 '+nR+'　':'')+(nF?'重点标记 '+nF:'')+'</span>'+
    '<span style="margin-left:auto" class="pool-row"><button class="tech-btn" id="pDiscard">放弃</button><button class="tech-btn pri" id="pSave"'+(poolBusy?' disabled':'')+'>保存并更新</button></span></div>';

      parsed.forEach(x=>{ const l=lab[x.status]; p+='<tr><td><span class="pool-tag '+l[0]+'">'+l[1]+'</span></td><td>'+esc(x.code||x.codeRaw)+'</td><td>'+esc(x.name||"")+(x.focus?' ★':'')+'</td><td style="text-align:left">'+esc(x.note||"")+'</td></tr>'; });

    if(rep){ toRemove=techStockList.filter(s=>s.enabled&&!keep.has(s.code)&&!poolOps.add[s.code]).map(s=>s.code);
      if(!keep.size){ alert("导入清单里没有有效代码，已取消。"); return; }
      if(toRemove.length&&!confirm("“替换整个股票池”会停用 "+toRemove.length+" 只不在清单里的股票（历史数据保留，可恢复）。确定吗？")) return; }
    ok.forEach(x=>poolStageAdd(x.code,x.name,x.focus));
    parsed.filter(x=>x.status==="exists"&&x.focus&&poolExisting(x.code)).forEach(x=>poolStageFocus(x.code,1));
    toRemove.forEach(c=>poolStageRemove(c));
    modal.hidden=true; poolMsg={t:"ok",m:"已加入待提交：新增/恢复 "+ok.length+" 只"+(toRemove.length?"，停用 "+toRemove.length+" 只":"")+"。确认无误后点“保存并更新”。"};
    renderTechPool(pane); };
}

window.addEventListener("resize", ()=>{
  if(chart) chart.resize();
  erpCharts.forEach(c=> c && c.resize && c.resize());
  if(metalsChart) metalsChart.resize();
  if(agriChart) agriChart.resize();
});
boot();
</script>
