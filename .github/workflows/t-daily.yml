name: t-daily
# T助手：每个交易日北京时间 21:00 计算重点股的关键价位、指标状态与历史统计 → t_api/
on:
  schedule:
    - cron: '0 13 * * 1-5'     # UTC 13:00 = 北京 21:00（GitHub 定时可能延后几分钟到半小时）
  push:
    paths:
      - 'tech_config/stocks.csv'   # 股票池/重点标记有变化时自动重算
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: t-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tushare pandas numpy six --quiet
      - run: python3 t_daily.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TUSHARE_MAX_CALLS_PER_MIN: '45'
      - name: 提交数据（无变化则跳过）
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add t_api data/t_min.sqlite
          if git diff --cached --quiet; then
            echo "无变化"; exit 0
          fi
          git commit -m "t update $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "第 $i 次推送失败，重试…"; sleep 5
          done
