name: coal-daily
on:
  schedule:
    - cron: '45 11 * * *'     # UTC 11:45 = 北京 19:45
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: coal-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 coal_ingest.py          # 纯标准库，不需要 pip 安装、不需要 Secret
      - run: python3 coal_export.py
      - name: 提交数据（同步远端 + 重试，容忍并发与偶发错误）
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/coal.db coal_api
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "coal update $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && { echo "推送成功"; exit 0; }
            echo "推送失败，第 $i 次重试…"; sleep 10
          done
          echo "多次重试仍失败"; exit 1
