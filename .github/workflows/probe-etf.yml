name: probe-etf
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tushare pandas akshare
      - run: python3 probe_etf.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
