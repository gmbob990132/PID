name: macro-daily
on:
  schedule:
    - cron: '30 10 * * *'     # UTC 10:30 = 北京 18:30（统计局月度数据多在每月 9-15 日 09:30 发布；日度的汇率/利差当天可取）
  workflow_dispatch:
    inputs:
      backfill:
        description: "全量回填统计局历史（约 5 分钟）"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: macro-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install akshare tushare pandas six openpyxl
      - run: python3 macro_ingest.py ${{ github.event.inputs.backfill == 'true' && '--backfill' || '' }}
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - run: python3 macro_export.py
      - name: 提交数据（同步远端 + 重试）
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/macro.db macro_api macro_config
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "macro update $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && { echo "推送成功"; exit 0; }
            echo "推送失败，第 $i 次重试…"; sleep 10
          done
          echo "多次重试仍失败"; exit 1
