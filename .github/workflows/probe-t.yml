name: probe-t
# 做T 模块第一步：探测 30/60 分钟 K 线的数据来源（只读，不写库）
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tushare pandas six --quiet
      - run: python3 probe_t_hkmin.py
