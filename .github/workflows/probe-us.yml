name: probe-us
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install akshare tushare --quiet
      - run: python3 probe_us.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
