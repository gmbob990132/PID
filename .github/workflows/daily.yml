name: daily-update
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取 → 写库
        run: python3 ingest.py
      - name: 导出前端 JSON
        run: python3 export_json.py
      - name: 提交数据与页面（无变化则跳过，不报错）
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "auto update $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
