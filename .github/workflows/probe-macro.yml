name: probe-macro
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install akshare tushare pandas six openpyxl
      - run: python3 probe_macro.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
